<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="app.js"></script>
</head>
<body>

<div class="container">

    <h1>Digital Twin Dashboard</h1>

    <div class="card">
        <h2>Training Control</h2>
        <p>Current Set : <span id="currentSet">1</span></p>
        <p>Time : <span id="timer">0 s</span></p>
        
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
        <button id="resetBtn">Reset</button>
        <button id="saveSetBtn">Save Set</button>
        <button id="downloadBtn">Download CSV</button>

        <div id="resultArea" style="margin-top: 15px; font-weight: bold; color: #333;"></div>
    </div>

    <div class="card">
        <h2>Orientation</h2>
        <p>Roll : <span id="roll">0</span>°</p>
        <p>Pitch : <span id="pitch">0</span>°</p>
        <p>Yaw : <span id="yaw">0</span>°</p>
    </div>

    <div class="card">
        <h2>Accelerometer</h2>
        <p>X : <span id="ax">0</span></p>
        <p>Y : <span id="ay">0</span></p>
        <p>Z : <span id="az">0</span></p>
    </div>

</div>

</body>
</html>
